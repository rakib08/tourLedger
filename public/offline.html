<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243a">
  <title>TourLedger — You're offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fa;color:#172033;font-family:Arial,Helvetica,sans-serif}
    main{width:min(100%,420px);padding:28px;border:1px solid #e2e8f0;border-radius:22px;background:#fff;text-align:center;box-shadow:0 12px 36px #10243a12}
    .mark{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 18px;border-radius:15px;background:#10243a;color:#e5bb68;font-weight:800}
    h1{margin:0;color:#10243a;font-size:22px}p{margin:12px 0 22px;color:#64748b;font-size:14px;line-height:1.6}
    button{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:#10243a;color:#fff;font-weight:700;font-size:14px}
  </style>
</head>
<body><main><div class="mark">TL</div><h1>You're offline</h1><p>TourLedger needs an internet connection to securely load your group and financial information. Reconnect and try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
